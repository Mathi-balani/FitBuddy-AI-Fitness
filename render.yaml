services:
  - type: web
    name: fitbuddy-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FITNESS_MODEL
        value: gemini-3.8-flash
      - key: TIP_MODEL
        value: gemini-3.8-flash
